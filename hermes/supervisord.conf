[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:xvfb]
command=Xvfb :99 -screen 0 1280x900x24 -nolisten tcp
user=node
priority=10
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:fluxbox]
command=fluxbox
user=node
environment=DISPLAY=":99",HOME="/home/node"
priority=20
autorestart=true
startsecs=3
stdout_logfile=/dev/null
redirect_stderr=true

[program:chrome]
command=/app/start-chrome.sh
user=node
environment=DISPLAY=":99",HOME="/home/node"
priority=30
autorestart=true
startsecs=5
stdout_logfile=/dev/null
redirect_stderr=true

; Tela remota: só em localhost; o Traefik expõe o noVNC com senha.
[program:x11vnc]
command=x11vnc -display :99 -forever -shared -nopw -localhost -rfbport 5900 -quiet
user=node
priority=40
autorestart=true
startsecs=3
stdout_logfile=/dev/null
redirect_stderr=true

[program:novnc]
command=websockify --web /usr/share/novnc 6080 127.0.0.1:5900
user=node
priority=50
autorestart=true
stdout_logfile=/dev/null
redirect_stderr=true

[program:api]
command=node /app/server.mjs
user=node
environment=HOME="/home/node"
directory=/app
priority=60
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
