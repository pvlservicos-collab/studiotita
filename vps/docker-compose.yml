# Postador do Studio Titã na VPS do Titã (/docker/postador). O Traefik (/docker/traefik)
# faz o HTTPS de srv2009990.hstgr.cloud. Não mexe no CRM nem na Evolution.
#   upload: recebe vídeo/capa com assinatura (PUT /upload, POST /fetch)
#   files:  serve os arquivos em /v/ (é daí que a Meta busca o vídeo)
services:
  upload:
    image: python:3.13-alpine
    restart: unless-stopped
    user: "65534:65534"
    command: ["python", "-u", "/app/upload.py"]
    env_file: .env
    environment:
      VIDEOS_DIR: /srv/videos
      BIND: 0.0.0.0
    volumes:
      - ./upload.py:/app/upload.py:ro
      - ./videos:/srv/videos
    labels:
      - traefik.enable=true
      - traefik.http.routers.postador-upload.rule=Host(`${HOST}`) && (PathPrefix(`/upload/`) || PathPrefix(`/fetch/`))
      - traefik.http.routers.postador-upload.entrypoints=websecure
      - traefik.http.routers.postador-upload.tls=true
      - traefik.http.routers.postador-upload.tls.certresolver=letsencrypt
      - traefik.http.services.postador-upload.loadbalancer.server.port=3311

  files:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./videos:/usr/share/nginx/html/v:ro
      - ./nginx-files.conf:/etc/nginx/conf.d/default.conf:ro
    labels:
      - traefik.enable=true
      - traefik.http.routers.postador-files.rule=Host(`${HOST}`) && PathPrefix(`/v/`)
      - traefik.http.routers.postador-files.entrypoints=websecure
      - traefik.http.routers.postador-files.tls=true
      - traefik.http.routers.postador-files.tls.certresolver=letsencrypt
      - traefik.http.services.postador-files.loadbalancer.server.port=80
